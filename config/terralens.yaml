# TerraLens runtime configuration. Paths are relative to the project root.
config_version: C-2026.09-01

runtime:
  # auto | cpu | mps. "auto" picks Apple MPS when available, else CPU.
  device: auto
  api_host: 127.0.0.1          # localhost only; never bind 0.0.0.0 by default
  api_port: 8740
  offline: true                # sets HF_HUB_OFFLINE etc. and blocks model downloads
  worker_poll_seconds: 2
  job_heartbeat_seconds: 30
  job_stale_after_seconds: 600 # a running job with no heartbeat for this long is resumable

database:
  host: 127.0.0.1
  port: 55432
  user: terralens
  name: terralens

paths:
  data: data
  raw: data/raw                 # registered raw scenes (read-only after registration)
  incoming: data/incoming       # watch folder
  holdback: data/holdback       # scenes held back for the live incremental-ingest demo
  quarantine: data/quarantine
  cog: data/cog                 # standardised reflectance COGs
  masks: data/masks
  features: data/features       # class-probability COGs
  chips: data/chips             # PNG cache for cards / timelapse
  gis: data/gis
  exports: data/exports
  manifests: data/manifests
  reports: data/reports
  models: models
  uploads: var/uploads

grid:
  crs: EPSG:32644
  gsd_m: 10
  origin: [0, 0]                # pixel grid origin; multiples of 60 m match S2 10/20/60 m grids
  tile_size_px: 128             # 1.28 km at 10 m
  tile_stride_px: 64            # 50 % overlap
  block_px: 512                 # processing block size for windowed reads/writes

pipeline:
  preprocessing_version: pp-1.0.0
  bands: [B02, B03, B04, B08, B11, B12]
  resample_20m: bilinear        # B11/B12 upsampled exactly 2x onto the 10 m grid; SCL uses nearest
  reflectance_scale: 10000
  embed_policy:
    per: month                  # one embedding per tile per month
    min_usable_fraction: 0.9    # only embed tile-dates at least this clean
  encoder_input_px: 224

sensors:
  sentinel-2:
    platforms: [sentinel-2a, sentinel-2b, sentinel-2c]
    instrument: msi
    levels: [L2A]
    gsd_m: 10
    offset_change_baseline: "04.00"   # from 25 Jan 2022 the L2A BOA_ADD_OFFSET is -1000
    offset_change_date: "2022-01-25"

active_threshold_set: T-2026.09-01
active_encoder: null              # set by `terralens models select-encoder` after the bake-off
llm:
  enabled: auto                   # auto: used only if the GGUF file in the manifest is present
  timeout_seconds: 20
voice:
  enabled: auto
auth:
  users_file: var/users.json      # generated by `terralens setup`; never committed
